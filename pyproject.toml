[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinevolve"
version = "1.0.0"
description = "ClinEvolve: gated program-level repair and self-improvement of clinical agents"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "CC-BY-NC-SA-4.0"}

[tool.setuptools]
packages = {find = {include = ["clinevolve*", "agent*", "utils*"]}}
py-modules = ["task_agent", "meta_agent"]
